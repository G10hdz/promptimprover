name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El notebook compila
        run: |
          python3 - <<'PY'
          import json
          nb = json.load(open('prompt_improver_multiAI.ipynb'))
          for i, cell in enumerate(nb['cells']):
              if cell['cell_type'] == 'code':
                  compile(''.join(cell['source']), f'cell_{i}', 'exec')
          print('ok')
          PY
      - name: Secretos (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact -v

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>promptimprover: arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>promptimprover: optimizador multiagente</h1>
    <p class="sub">Kavak × OpenAI hackathon. Un notebook que mejora prompts con agentes especializados por tipo de problema.</p>

    <svg viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pi-title pi-desc">
      <title id="pi-title">promptimprover: checkers y rewriters</title>
      <desc id="pi-desc">Un notebook Jupyter orquesta agentes: Dev-Contradiction-Checker detecta contradicciones, Format-Checker detecta salidas estructuradas sin spec, Few-Shot-Consistency-Checker revisa ejemplos, Dev-Rewriter reescribe el prompt y un reescritor de few-shot arregla ejemplos; salida adaptada a OpenAI, Gemini y Anthropic.</desc>
      <defs>
        <marker id="pi-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="pi-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="430" fill="#f5f5f5"/>

      <!-- input -->
      <rect x="40" y="170" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prompt + few-shots</text>
      <text x="140" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entrada del usuario</text>

      <!-- notebook orchestrator -->
      <rect x="300" y="60" width="330" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="465" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROMPT_IMPROVER_MULTIAI.IPYNB</text>

      <!-- checkers -->
      <rect x="320" y="100" width="290" height="110" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="465" y="122" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checkers (analisis)</text>
      <text x="465" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dev-Contradiction-Checker</text>
      <text x="465" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Format-Checker: JSON/CSV/MD</text>
      <text x="465" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Few-Shot-Consistency-Checker</text>

      <!-- rewriters -->
      <rect x="320" y="230" width="290" height="80" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="465" y="252" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rewriters (arreglo)</text>
      <text x="465" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dev-Rewriter: conserva intencion</text>
      <text x="465" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Few-shot rewriter: alinea ejemplos</text>

      <rect x="320" y="322" width="290" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="465" y="341" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cada iteracion mejora la metrica anterior</text>

      <!-- outputs -->
      <rect x="700" y="90" width="360" height="220" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="880" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3 OUTPUTS POR PROVIDER</text>
      <g font-family="'Geist Mono', monospace" font-size="9.5">
        <rect x="720" y="130" width="320" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.9"/><text x="880" y="150" fill="#2d3142" text-anchor="middle">OpenAI</text><text x="880" y="166" fill="#4f5d75" font-size="8.5" text-anchor="middle">SDK / formato del provider</text>
        <rect x="720" y="182" width="320" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.9"/><text x="880" y="202" fill="#2d3142" text-anchor="middle">Gemini</text><text x="880" y="218" fill="#4f5d75" font-size="8.5" text-anchor="middle">SDK / formato del provider</text>
        <rect x="720" y="234" width="320" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.9"/><text x="880" y="254" fill="#2d3142" text-anchor="middle">Anthropic</text><text x="880" y="270" fill="#4f5d75" font-size="8.5" text-anchor="middle">SDK / formato del provider</text>
      </g>
      <text x="880" y="300" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">mismo analisis, 3 adaptaciones</text>

      <!-- edges -->
      <path d="M 240 210 L 320 175" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pi-arrow)"/>
      <path d="M 240 210 L 320 255" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pi-arrow)"/>
      <path d="M 610 155 L 700 152" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#pi-arrow-accent)"/>
      <path d="M 610 270 L 700 256" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#pi-arrow-accent)"/>
      <path d="M 465 210 L 465 230" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pi-arrow)"/>
      <text x="500" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">problemas</text>

      <!-- footer -->
      <rect x="40" y="370" width="1020" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="550" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MD en repo documenta el flujo; cada agente cubre un tipo de problema</text>
    </svg>
  </div>
</body>
</html>
